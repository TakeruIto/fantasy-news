name: Isekai Newspaper

on:
  schedule:
    # Monday 07:00 JST is Sunday 22:00 UTC.
    - cron: '0 22 * * 0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ENABLE_IMAGE_GENERATION: ${{ secrets.ENABLE_IMAGE_GENERATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: npm ci

      - name: Generate newspaper
        run: npm run generate:newspaper

      - name: Upload generated newspaper
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isekai-newspaper
          path: |
            dist/*.pdf
            dist/*.html
            dist/*.json
            dist/images/*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
