name: Isekai Newspaper

on:
  schedule:
    # Daily 07:00 JST is 22:00 UTC on the previous day.
    - cron: '0 22 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
      NEWSPAPER_IMAGE_PROMPT: ${{ vars.NEWSPAPER_IMAGE_PROMPT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore newspaper archive
        uses: actions/cache@v5
        with:
          path: |
            dist/newspapers
            dist/issues
          key: newspapers-${{ github.run_id }}
          restore-keys: |
            newspapers-

      - name: Install dependencies
        run: npm ci

      - name: Generate newspaper
        run: npm run generate:newspaper

      - name: Upload generated newspaper
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isekai-newspaper
          path: |
            dist/*.html
            dist/*.json
            dist/newspapers/*.png
            dist/issues/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
