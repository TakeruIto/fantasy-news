name: Isekai Newspaper

on:
  schedule:
    # Monday 07:00 JST is Sunday 22:00 UTC.
    - cron: '0 22 * * 0'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ENABLE_IMAGE_GENERATION: ${{ secrets.ENABLE_IMAGE_GENERATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: npm ci

      - name: Generate newspaper
        run: npm run generate:newspaper

      - name: Upload generated newspaper
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isekai-newspaper
          path: |
            dist/*.pdf
            dist/*.html
            dist/*.json
            dist/images/*
          if-no-files-found: warn
          retention-days: 30
